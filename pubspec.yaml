name: flo
description: Flo — Smart Expense Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Local database — sqflite on mobile, hive on web
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0

  # Charts
  fl_chart: ^0.68.0

  # Date & currency formatting
  intl: ^0.20.2

  # Receipt scanner
  image_picker: ^1.1.2

  # Excel export
  syncfusion_flutter_xlsio: ^33.2.8
  share_plus: ^10.0.0

  # Responsive
  responsive_framework: ^1.5.1

  # Utilities
  uuid: ^4.4.0
  get_it: ^8.0.2
  crypto: ^3.0.3
  easy_localization: ^3.0.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icon/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_18pt-Regular.ttf
        - asset: assets/fonts/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_18pt-SemiBold.ttf
          weight: 600
