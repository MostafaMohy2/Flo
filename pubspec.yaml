name: flo
description: Flo — Smart Expense Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Local database (web + mobile)
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0

  # Charts
  fl_chart: ^0.68.0

  # Date & currency formatting
  intl: ^0.20.2

  # Receipt scanner (mobile only — OCR stubbed on web)
  image_picker: ^1.1.2

  # Utilities
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0
  get_it: ^8.0.2
  crypto: ^3.0.3
  easy_localization: ^3.0.8
  shared_preferences: ^2.3.2
  device_preview: ^1.2.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/translations/
    - assets/icon/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_18pt-Regular.ttf
        - asset: assets/fonts/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_18pt-SemiBold.ttf
          weight: 600
